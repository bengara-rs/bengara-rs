[package]
name = "bengara-build"
description = "bengara の build.rs 用。Laravel と同じ名前のファイルを自動検出してモジュール宣言を生成する（依存クレートなし）"
keywords = ["build-dependencies", "bengara", "codegen"]
categories = ["development-tools::build-utils"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]

[lints.rust]
# `cargo fuzz` が付ける cfg（ファジングのための口）。clippy の警告で落ちないように知らせておく。
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }
