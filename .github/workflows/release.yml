name: Release

# main の CI（ci.yml）が通ったら crates.io に出す。
# 検査は CI に任せ、ここでは繰り返さない。CI が落ちたら出さない。
# workspace の version（Cargo.toml）が crates.io にまだ無いクレートだけを出す。
# 版を上げずに push したときは、何も出さずに終わる。
on:
  workflow_run:
    workflows: [ CI ]
    types: [ completed ]
    branches: [ main ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

# 出している途中で次の合図が来ても、止めずに順に流す。
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    # 手で流したとき（main を選んだとき）か、main への push の CI が通ったときだけ。
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # CI が検査したコミットを出す（手で流したときは main の先頭）。
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - name: crates.io に出す
        shell: bash
        env:
          CARGO_TOKEN: ${{ secrets.CARGO_TOKEN }}
        run: |
          if [ -z "$CARGO_TOKEN" ]; then
            echo "secrets.CARGO_TOKEN がありません"
            exit 1
          fi
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "bengara") | .version')
          echo "版: $version"
          # 依存される側から順に出す（bengara は bengara-macros に依存する）。
          # cargo publish は、出した版が索引に載るまで待ってから終わる。
          for crate in bengara-macros bengara-build bengara; do
            status=$(curl -s -o /dev/null -w '%{http_code}' \
              -A "bengara-rs release (https://github.com/bengara-rs/bengara-rs)" \
              "https://crates.io/api/v1/crates/$crate/$version")
            if [ "$status" = "200" ]; then
              echo "$crate $version は出してあります。飛ばします"
              continue
            fi
            if [ "$status" != "404" ]; then
              echo "crates.io に問い合わせられませんでした（$status）"
              exit 1
            fi
            echo "$crate $version を出します"
            cargo publish -p "$crate" --locked
          done
