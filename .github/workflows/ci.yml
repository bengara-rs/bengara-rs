name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # フレームワーク単体の検査。
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # データベースを入れた状態でも通ることを確かめる。
      - run: cargo clippy --workspace --all-targets --features "sqlite encryption" -- -D warnings
      - run: cargo test --workspace --features "sqlite encryption"
      # ドライバ・メール・WebSocket・Argon2id・bcrypt・テンプレート・OS の数を全部入れた状態。
      # TLS（rustls + ring）のビルドに C コンパイラが要るので、3つの OS で確かめる。
      # metrics-system は OS ごとに別のコードを通るので、3 つの OS のテストで確かめる。
      - run: cargo clippy --workspace --all-targets --features "sqlite mysql postgres mail encryption websocket argon2 bcrypt view metrics-system" -- -D warnings
      - run: cargo test --workspace --features "sqlite mysql postgres mail encryption websocket argon2 bcrypt view metrics-system"
      # 機能フラグを外しても通ることを確かめる。
      - run: cargo clippy -p bengara --no-default-features --all-targets -- -D warnings
      - run: cargo clippy -p bengara --no-default-features --all-targets --features metrics-system -- -D warnings
      - run: cargo test -p bengara --no-default-features --features sqlite

  # 機能フラグを1つずつ入れた状態。組み合わせの取りこぼしを防ぐ。
  features:
    name: features
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature: [ sqlite, mysql, mariadb, postgres, mail, encryption, websocket, argon2, bcrypt, view, metrics-system ]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p bengara --no-default-features --all-targets --features ${{ matrix.feature }} -- -D warnings
      - run: cargo test -p bengara --no-default-features --features ${{ matrix.feature }}

  # 本物の MySQL と PostgreSQL につないで確かめる。
  # 接続先の環境変数が無いときは、ドライバのテストは何もしません。
  database:
    name: database
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: bengara
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psecret"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: bengara
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: bengara
        ports:
          - 5432:5432
        options: >-
          --health-cmd=pg_isready
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    env:
      BENGARA_TEST_MYSQL_URL: mysql://root:secret@127.0.0.1:3306/bengara
      BENGARA_TEST_POSTGRES_URL: postgres://bengara:secret@127.0.0.1:5432/bengara
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p bengara --features "mysql postgres"

  # 対応する一番古い Rust 版（Cargo.toml の rust-version）で通ることを確かめる。
  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --features "sqlite mysql postgres mail encryption websocket argon2 bcrypt view metrics-system"

  # 利用者の手順をそのまま再現する。
  # cargo new → init → build → test が通ること。
  user-flow:
    name: user-flow (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v4
        with:
          path: bengara-rs
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo new してフレームワークを手元のソースに差し替える
        shell: bash
        run: |
          cargo new myapp
          cd myapp
          # cargo new の Cargo.toml は [dependencies] で終わるので、そこへ追記する。
          # 公開前なので、crates.io ではなく手元のソースを使う。
          # [patch] は依存の版の指定に合うときだけ効く。試験版（0.1.0-alpha.1 など）は
          # "0.1" に合わないので、workspace の版をそのまま書く。
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' ../bengara-rs/Cargo.toml | head -n 1)
          printf 'bengara = { version = "%s", features = ["sqlite"] }\n\n' "$version" >> Cargo.toml
          printf '[patch.crates-io]\n' >> Cargo.toml
          printf 'bengara = { path = "../bengara-rs/crates/bengara" }\n' >> Cargo.toml
          printf 'bengara-build = { path = "../bengara-rs/crates/bengara-build" }\n' >> Cargo.toml
          printf 'bengara-macros = { path = "../bengara-rs/crates/bengara-macros" }\n' >> Cargo.toml
          printf 'fn main() { bengara::run() }\n' > src/main.rs
      # ルートに Cargo.toml が無いので、ビルドする myapp を指す。
      # myapp を作った後に置く（無い場所では、キャッシュの鍵を作れない）。
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: myapp -> target
      - name: init してビルドとテスト
        shell: bash
        working-directory: myapp
        run: |
          cargo run -- init
          cargo build
          cargo test
          cargo run -- route:list
          cargo run -- migrate
          cargo run -- migrate:status
          cargo run -- db:seed
          # 周辺機能のコマンドも、雛形のまま動くこと。
          cargo run -- cache:clear
          cargo run -- schedule:list
          cargo run -- schedule:run
          cargo run -- lang:list
          # 本番の置き方のコマンドも、雛形のまま動くこと。
          cargo run -- storage:init
          cargo run -- about
      - name: リリースビルドで public/ が埋め込まれる
        shell: bash
        working-directory: myapp
        run: |
          cargo build --release
          # 生成されたコードに include_bytes! が入っていること。
          # init は public/robots.txt を作るので、必ず1件以上ある。
          # 置き場所は Cargo の版で違う（myapp-<英数字>/out/ と myapp/<英数字>/out/）ので、
          # パスは決め打ちせずにファイル名で探す。
          if ! grep -rq --include=bengara_app.rs "include_bytes!" target/release/build; then
            echo "public/ が埋め込まれていません"
            exit 1
          fi
          echo "public/ が埋め込まれました"

  # ログが 3 つの出し先に正しく出ることを、利用者と同じ形のアプリで確かめる。
  # serve を本当に起動し、curl で叩いてから止め、storage/logs/ の中身を見る。
  log-smoke:
    name: log-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: bengara-rs
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo new してフレームワークを手元のソースに差し替える
        shell: bash
        run: |
          cargo new myapp
          cd myapp
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' ../bengara-rs/Cargo.toml | head -n 1)
          printf 'bengara = { version = "%s", features = ["sqlite"] }\n\n' "$version" >> Cargo.toml
          printf '[patch.crates-io]\n' >> Cargo.toml
          printf 'bengara = { path = "../bengara-rs/crates/bengara" }\n' >> Cargo.toml
          printf 'bengara-build = { path = "../bengara-rs/crates/bengara-build" }\n' >> Cargo.toml
          printf 'bengara-macros = { path = "../bengara-rs/crates/bengara-macros" }\n' >> Cargo.toml
          printf 'fn main() { bengara::run() }\n' > src/main.rs
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: myapp -> target
      - name: init してビルドする
        shell: bash
        working-directory: myapp
        run: |
          cargo run -- init
          cargo build
          cargo run -- storage:init
      - name: ログを確かめる
        shell: bash
        working-directory: myapp
        run: |
          set -euo pipefail
          # 起動して、3 つを叩いて、止める。応答には X-Request-Id が付くこと。
          run_once() {
            ./target/debug/myapp serve --port 8098 > serve.out 2>&1 &
            local pid=$!
            for _ in $(seq 30); do
              curl -sf http://127.0.0.1:8098/up > /dev/null && break
              sleep 1
            done
            for path in / /nope /up; do
              curl -s -D - -o /dev/null "http://127.0.0.1:8098$path" | tr -d '\r' \
                | grep -Eiq '^x-request-id: [0-9a-f]{32}$' \
                || { echo "$path に X-Request-Id がありません"; cat serve.out; exit 1; }
            done
            kill -TERM "$pid"
            wait "$pid" || true
          }
          count_access() {
            python3 -c "import sqlite3,sys; print(sqlite3.connect(sys.argv[1]).execute('select count(*) from access').fetchone()[0])" "$1"
          }
          TODAY=$(date -u +%F)
          LOGS=storage/logs

          run_once
          ACCESS="$LOGS/access-$TODAY.log"
          cat "$ACCESS"
          grep -q '"GET / HTTP/1.1" 200 ' "$ACCESS" || { echo "/ の行がありません"; exit 1; }
          grep -q '"GET /nope HTTP/1.1" 404 ' "$ACCESS" || { echo "404 の行がありません"; exit 1; }
          if grep -q '"GET /up ' "$ACCESS"; then echo "/up の 200 が出ています"; exit 1; fi
          test -f "$LOGS/app-$TODAY.log" || { echo "app のログがありません"; exit 1; }
          [ "$(count_access "$LOGS/logs-$TODAY.sqlite")" = "2" ] || { echo "SQLite の access が 2 件ではありません"; exit 1; }

          # LOG_CHANNEL=stdout では、ファイルにも SQLite にも増えない。
          LINES=$(wc -l < "$ACCESS")
          LOG_CHANNEL=stdout run_once
          [ "$(wc -l < "$ACCESS")" = "$LINES" ] || { echo "stdout なのにファイルに書きました"; exit 1; }
          [ "$(count_access "$LOGS/logs-$TODAY.sqlite")" = "2" ] || { echo "stdout なのに SQLite に書きました"; exit 1; }
          grep -q 'GET /nope -> 404' serve.out || { echo "標準出力にアクセスの行がありません"; cat serve.out; exit 1; }
          echo "ログは期待どおりです"
