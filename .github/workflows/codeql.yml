name: CodeQL

# コードの静的な検査（CodeQL）。結果は GitHub の Security タブに送る。
# 送るには、リポジトリが公開されているか、GitHub Code Security が要る。
on:
  push:
    branches: [ main, develop ]
    # 文書だけの変更では動かさない。
    paths-ignore: [ "**.md", "docs/**", "LICENSE-*" ]
  pull_request:
    paths-ignore: [ "**.md", "docs/**", "LICENSE-*" ]
  schedule:
    # 週 1 回（月曜の UTC 4 時 23 分）。
    - cron: "23 4 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

# 同じブランチに続けて push したら、前の実行を止める。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Rust はビルドせずに解析する（build-mode: none）。
      - uses: github/codeql-action/init@v4
        with:
          languages: rust
          build-mode: none
          queries: security-extended
          # 外す検査とその理由は、この設定ファイルに書いてある。
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:rust"
